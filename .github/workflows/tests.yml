name: Notebook and verification checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Execute the complete notebook
        run: python -m jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=1800 Hyperion.ipynb
