# FLIGHT: launch conditions, guidance, control, limits and integration.
# Edit these saved settings, then rerun Hyperion.ipynb.
# Mission values retain the master source case. The departure section is the
# active coast/restart case, shared by Simulation and Verification.

description = "Hyperion 28 Oct 2026 synced sizing geometry; selected low-AoA 6DOF RK45 guidance."
input_audit = "inputs/reference.json"
assumptions = [
  "Full-vehicle aero export geometry/reference area is unverified. CP inches from nose is inferred from RASAero and tentative user confirmation.",
  "Gimbal cone, rate, actuator response and all engines gimballed are design assumptions, not approved hardware capabilities.",
  "RCS authority is limited to the configured moments. Powered-off control can fail; central-axis TVC cannot control roll.",
  "Equivalent tank columns, dry cylindrical masses, engine pivots, payload/fairing mass stations inferred within supplied dimensions.",
  "Fairing allocated from stage1 dry budget; adapter allocated inside upper-stage dry budget.",
  "Upper-stage and bare vehicle reuse full-stack aero table; all such samples are flagged.",
  "Deterministic legacy wind magnitude plus assumed eastward direction/taper, not a measured launch sounding.",
  "Fixed source thrust and Isp: nozzle exit area absent, pressure correction disabled explicitly.",
  "Separation impulse/delay are assumptions; no shock, flex, buffet, slosh, collision or stage-return analysis.",
  "The ascent uses the configured provisional parking target. Integrated TMI continues that state through coast and restart; payload deployment needs a separate study.",
  "Selected sizing geometry conflicts with master Payload fairing geometry. Mass stations need CAD reconciliation, and aero export geometry is unverified.",
]

# Kennedy Space Center launch position; azimuth is clockwise from north.
[launch]
latitude_deg = 28.608
longitude_deg = -80.604
altitude_m = 1.0
azimuth_deg = 90.0

# Standard layered atmosphere plus a deterministic wind/gust model.
# Reference speed follows the saved legacy case; direction and taper are assumed.
[atmosphere]
temperature_offset_K = 0.0
density_scale = 1.0
wind_reference_m_s = 7.62
wind_reference_height_m = 10.0
wind_exponent = 0.2
wind_cap_height_m = 1000.0
wind_taper_height_m = 20000.0
wind_zero_height_m = 80000.0
wind_toward_deg_east_of_north = 90.0
gust_amplitude_m_s = 0.0
gust_period_s = 12.0

# Acceptance limits and commanded axial acceleration cap.
# command_axial_g reserves margin below the axial_g acceptance limit.
[limits]
axial_g = 6.0
lateral_g = 2.0
control_ratio = 2.0
command_axial_g = 5.8

# Attitude loop and actuator model. RCS moments are credited only if nonzero.
[control]
natural_frequency_rad_s = 0.6
damping_ratio = 1.0
actuator_time_constant_s = 0.15
rcs_moment_Nm = 0.0
roll_rcs_moment_Nm = 0.0
angular_acceleration_limit_deg_s2 = 0.3
upper_angular_acceleration_limit_deg_s2 = 1.5

# Paired times/fractions are linearly interpolated. Engine minimums still apply.
[throttle]
time_s = [0, 35, 65, 90, 120, 1000]
fraction = [1.0, 1.0, 0.8, 0.8, 1.0, 1.0]

# Paired pitch times/angles use local elevation (90 degrees is vertical).
# During high Q, the AoA cap modifies this schedule; the altitude loop targets orbit.
[guidance]
pitch_time_s = [0, 3, 12, 45, 90, 140, 200, 1000]
pitch_deg = [90, 90, 85, 85, 50, 25, 12, 0]
aoa_limit_min_q_Pa = 5000.0
aoa_command_limit_deg = 2
target_altitude_m = 200000.0
altitude_gain_s2 = 0.00155
vertical_damping_s = 0.08
post_cutoff_coast_s = 30.0
aoa_limit_start_s = 25.0

# Discrete staging and fairing release. The delta-v impulse acts on the upper stage.
[separation]
delay_s = 2.0
upper_delta_v_m_s = 0.5
impulse_duration_s = 0.5
fairing_altitude_m = 110000.0

# RK45 numerical controls. Output spacing does not replace the adaptive solver step.
[solver]
method = "RK45"
rtol = 2e-07
position_atol_m = 0.002
velocity_atol_m_s = 1e-05
max_step_s = 0.4
output_step_s = 0.2
max_time_s = 900.0
verbose = false

# Sourced master mission case for comparison; not the active TMI acceptance target.
[mission]
launch_site = "Kennedy Space Center"
injection_strategy = "200km EPO"
parking_perigee_m = 200000
target_C3_km2_s2 = 7.7058
case_A_departure_date = "2033-04-28 00:00:00"
time_of_flight_days = 274
TMI_delta_v_m_s = 3570.5

# Active departure screen. Coast is assumed; restart debit follows the saved
# upper-stage startup debit. The target is provisional and differs from the
# master comparison case above. No Mars intercept is solved by this screen.
[departure]
coast_duration_s = 600
restart_propellant_kg = { ref = "vehicle.stages.1.startup_propellant_kg" }
target_c3_km2_s2 = 9.8
max_burn_duration_s = 900
output_step_s = 2

[[choices]]
label = "Departure baseline"
values = ["departure.coast_duration_s", "departure.restart_propellant_kg", "departure.target_c3_km2_s2"]
basis = "The verification target is provisional. The master target is retained as a separate comparison case; neither is a solved encounter."

[[choices]]
label = "Integrator"
values = ["solver.method", "solver.rtol", "solver.max_step_s"]
basis = "Quaternion rigid-body 6DOF with discrete stage and fairing events; no flexible dynamics."

[[choices]]
label = "Atmosphere and wind"
values = ["atmosphere.wind_reference_m_s", "atmosphere.wind_toward_deg_east_of_north", "atmosphere.temperature_offset_K", "atmosphere.density_scale"]
basis = "Layered standard atmosphere and a deterministic wind profile; no measured launch sounding."

[[choices]]
label = "Coast and roll control"
values = ["control.rcs_moment_Nm", "control.roll_rcs_moment_Nm", "limits.control_ratio"]
basis = "Evaluate all phases. No central-axis TVC roll authority is available."

[[choices]]
label = "Actuator response"
values = ["control.actuator_time_constant_s"]
basis = "Assumed first-order response; requires hardware confirmation."

[[choices]]
label = "Separation"
values = ["separation.delay_s", "separation.upper_delta_v_m_s", "separation.impulse_duration_s"]
basis = "Rigid-body impulse screen only; shock, flex, collision and returned-stage trajectories need separate work."

[[choices]]
label = "Parking orbit"
values = ["guidance.target_altitude_m"]
basis = "Provisional circular ascent target."
