# VEHICLE: edit physical hardware, mass, geometry and aerodynamic interpretation here.
# Units are in each key. SI is used internally; angles labeled deg are degrees.
# Source: inputs/requirements/source_manifest.json, synced 28 Oct 2026.
# Values retain source precision so the baseline flight does not change.
# The notebooks show all values and the choices below before running.


# Stage 1 dry mass excludes the separately modeled fairing.
# Stage 2 dry mass already includes its adapter; do not add it again.
# When changing propellant, update the stage propellant_kg and its tank
# loaded_mass_kg values together. Their totals must agree; the loader allows
# numerical source roundoff, then rejects inconsistent inventories before a run.
[vehicle]
diameter_m = 5.4
payload_kg = 4313
fairing_kg = 2155.27825
fairing_length_m = 11.5
payload_cg_above_fairing_base_m = 4.5
payload_length_m = 6.0
payload_radius_m = 1.5
fairing_cg_above_base_m = 6.5
payload_station_m = 51.76301273945498

# Lengths and tank stations use the stage base as datum.
# Propellant is loaded mass; residual and startup debits are applied by the model.
# Gimbal travel/rate and engine pivots are assumptions.
# exit_area_m2 = 0 explicitly disables nozzle pressure correction.
[[vehicle.stages]]
name = "Stage 1"
dry_mass_kg = 28518.455236898277
residual_kg = 12225.67377549231
isp_s = 350
thrust_N = 6765000
min_throttle = 0.4
length_m = 32.625292661945515
startup_propellant_kg = 2956.4335752961897
propellant_kg = 422704.5665338655
engine_pivot_m = 1.5
gimbal_limit_deg = 5.0
gimbal_rate_deg_s = 5.0
exit_area_m2 = 0.0
reference_pressure_Pa = 101325.0

# Equivalent cylindrical liquid column for center-of-mass/inertia evolution.
# Loaded component mass is also reused in the tank-volume checks.
[[vehicle.stages.tanks]]
name = "LOX"
loaded_mass_kg = 330812.2694612861
bottom_m = 4.050000000000001
height_m = 12.76130694351566

# Equivalent cylindrical liquid column for center-of-mass/inertia evolution.
# Loaded component mass is also reused in the tank-volume checks.
[[vehicle.stages.tanks]]
name = "fuel"
loaded_mass_kg = 91892.29707257946
bottom_m = 18.161306943515658
height_m = 10.413985718429851

# Lengths and tank stations use the stage base as datum.
# Propellant is loaded mass; residual and startup debits are applied by the model.
# Gimbal travel/rate and engine pivots are assumptions.
# exit_area_m2 = 0 explicitly disables nozzle pressure correction.
[[vehicle.stages]]
