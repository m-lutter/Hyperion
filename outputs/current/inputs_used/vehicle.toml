# The CSV is interpolated by Mach and AoA.
# CP units/datum and source export reference geometry need confirmation.
[aero]
file = "inputs/aerodynamics.csv"
reference_area_m2 = 22.902210444669596
cp_station_offset_m = 0.0
cp_units = "inches converted to m"
cp_datum = "nose; RASAero-format inference"
outside_domain_policy = "endpoint hold AND flag every sample"
post_separation_policy = "reuse full vehicle coefficients; unvalidated proxy"

# Display-only explanation; selected values are read from the paths below.
[[choices]]
label = "Vehicle geometry"
values = ["vehicle.fairing_length_m", "vehicle.diameter_m"]
basis = "Selected sizing geometry. The master Payload sheet still gives a 14 m fairing; reconcile with CAD and the aero export."

# Display-only explanation; selected values are read from the paths below.
[[choices]]
label = "CP interpretation"
values = ["aero.cp_units", "aero.cp_datum"]
basis = "Inches are tentative user confirmation; datum is inferred and remains unverified."

# Display-only explanation; selected values are read from the paths below.
[[choices]]
label = "Aerodynamic reference"
values = ["aero.reference_area_m2", "aero.outside_domain_policy", "aero.post_separation_policy"]
basis = "Source export geometry is unverified. Flag out-of-domain and separated-vehicle proxy samples."

# Display-only explanation; selected values are read from the paths below.
[[choices]]
label = "Stage 1 control capability"
values = ["vehicle.stages.0.gimbal_limit_deg", "vehicle.stages.0.gimbal_rate_deg_s"]
basis = "Assumed actuator capability, not approved hardware performance."

# Display-only explanation; selected values are read from the paths below.
[[choices]]
label = "Stage 2 control capability"
values = ["vehicle.stages.1.gimbal_limit_deg", "vehicle.stages.1.gimbal_rate_deg_s"]
basis = "Assumed actuator capability, not approved hardware performance."
